spring:
  application:
    name: domuspacis-platform

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:domuspacis}?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  mvc:
    pathmatch:
      use-suffix-pattern: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 10
          order_inserts: true
          order_updates: true
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@domuspacis.rw}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    com.domuspacis: INFO
    org.springframework: ERROR
    org.springframework.web: WARN
    org.hibernate: ERROR
    com.zaxxer.hikari: WARN
    org.springframework.security: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

jwt:
  secret: ${JWT_SECRET:domuspacis_secure_default_jwt_secret_key_2026_at_least_32_bytes_long!}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  trust-proxy-headers: false
  rate-limit:
    login:
      max-requests-per-minute: 5
      max-failed-attempts: 5
      lockout-duration-minutes: 15
    password-reset:
      max-requests-per-minute: 3

