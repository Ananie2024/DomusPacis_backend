# Domus Pacis Platform — Default (deployment) profile
# Loaded when no spring profile is active (Hugging Face deployment).
# TiDB does not support Flyway's CREATE TABLE ... SELECT baseline,
# so Flyway is disabled and this idempotent script reconciles the
# partial schema (V1 present, V2-V9 missing) before Hibernate validate.
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:tidb-reconcile.sql
      data-locations: ""
      continue-on-error: false